# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Sveltia CMS

backend:
  name: github
  repo: WeiFurryovo/Inklume
  branch: main
  base_url: https://inklume.pages.dev

media_folder: public/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [zh, en]
  default_locale: zh
  initial_locales: default
  omit_default_locale_from_preview_path: true

slug:
  encoding: unicode
  clean_accents: true

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    icon: article
    folder: src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "/{{locale}}/posts/{{slug}}"
    summary: "{{title}} · {{pubDatetime | date('YYYY-MM-DD')}}"
    sortable_fields: [pubDatetime, title]
    view_filters:
      - { label: 草稿, field: draft, pattern: true }
      - { label: 非草稿, field: draft, pattern: false }
      - { label: 首页推荐, field: featured, pattern: true }
      - { label: 相册文章, field: gallery, pattern: true }
    view_groups:
      - { label: 发布状态, field: draft }
      - { label: 分类, field: category }
    fields:
      - { name: title, label: 标题, widget: string, i18n: true }
      - { name: body, label: 正文, widget: richtext, i18n: true }
      - { name: description, label: 摘要, widget: text, i18n: true }
      - name: heroImage
        label: 封面
        widget: object
        required: false
        collapsed: true
        i18n: duplicate
        fields:
          - { name: src, label: 图片, widget: image, i18n: duplicate }
          - {
              name: alt,
              label: 图片说明,
              widget: string,
              required: false,
              i18n: true,
            }
          - {
              name: color,
              label: 强调色,
              widget: color,
              required: false,
              i18n: duplicate,
            }
      - name: category
        label: 分类
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        display_fields: [name.zh, name.en]
        search_fields: [name.zh, name.en]
        default: unclassified
        i18n: duplicate
      - name: tags
        label: 标签
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        display_fields: [name.zh, name.en]
        search_fields: [name.zh, name.en]
        multiple: true
        required: false
        i18n: duplicate
      - {
          name: draft,
          label: 保存为草稿,
          widget: boolean,
          default: true,
          required: false,
          i18n: true,
        }
      - name: pubDatetime
        label: 发布时间
        widget: datetime
        default: "{{now}}"
        input_timezone: Asia/Singapore
        output_utc: true
        i18n: duplicate
      - {
          name: author,
          label: 作者,
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - {
          name: featured,
          label: 首页推荐,
          widget: boolean,
          default: false,
          required: false,
          i18n: duplicate,
        }
      - {
          name: gallery,
          label: 收录到相册,
          widget: boolean,
          default: false,
          required: false,
          i18n: duplicate,
        }
      - name: advanced
        label: 高级设置
        widget: object
        required: false
        collapsed: true
        i18n: duplicate
        fields:
          - name: modDatetime
            label: 更新时间
            widget: datetime
            required: false
            input_timezone: Asia/Singapore
            output_utc: true
            i18n: true
          - {
              name: ogImage,
              label: 分享图片,
              widget: image,
              required: false,
              i18n: duplicate,
            }
          - {
              name: canonicalURL,
              label: 原文地址,
              widget: string,
              required: false,
              i18n: true,
            }
          - {
              name: timezone,
              label: 显示时区,
              widget: string,
              required: false,
              i18n: duplicate,
            }
          - {
              name: hideEditPost,
              label: 隐藏编辑链接,
              widget: boolean,
              default: false,
              required: false,
              i18n: duplicate,
            }

  - name: pages
    label: 独立页面
    label_singular: 页面
    icon: description
    folder: src/content/pages
    create: false
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "/{{locale}}/{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string, i18n: true }
      - { name: body, label: 正文, widget: richtext, i18n: true }
      - {
          name: description,
          label: 摘要,
          widget: text,
          required: false,
          i18n: true,
        }
      - name: aboutModules
        label: 关于页内容
        widget: object
        required: false
        collapsed: true
        i18n: duplicate
        fields:
          - name: motto
            label: 简介
            widget: object
            collapsed: true
            i18n: duplicate
            fields:
              - { name: text, label: 介绍文字, widget: string, i18n: true }
              - { name: spoiler, label: 遮罩文字, widget: string, i18n: true }
          - name: cta
            label: 主要链接
            widget: object
            collapsed: true
            i18n: duplicate
            fields:
              - { name: label, label: 链接文字, widget: string, i18n: true }
              - name: href
                label: 链接地址
                widget: string
                i18n: duplicate
                pattern: &http_url ["^https?://", "请输入 HTTP(S) 地址"]
          - name: siteStack
            label: 技术栈
            widget: object
            collapsed: true
            i18n: duplicate
            fields:
              - { name: title, label: 标题, widget: string, i18n: true }
              - { name: description, label: 简介, widget: text, i18n: true }
              - {
                  name: groupLabel,
                  label: 分组名称,
                  widget: string,
                  i18n: true,
                }
              - name: items
                label: 技术项目
                widget: list
                collapsed: true
                i18n: duplicate
                summary: "{{name}}"
                fields:
                  - { name: name, label: 名称, widget: string, i18n: duplicate }
                  - { name: description, label: 说明, widget: text, i18n: true }
                  - name: icon
                    label: 图标
                    widget: select
                    i18n: duplicate
                    options:
                      - { label: Astro, value: astro }
                      - { label: Cloudflare, value: cloudflare }
                      - { label: GitHub, value: github }
                      - { label: Pagefind, value: pagefind }
                      - { label: Astro Theme Pure, value: pure }
                      - { label: Sveltia CMS, value: sveltia }
                  - {
                      name: href,
                      label: 地址,
                      widget: string,
                      i18n: duplicate,
                      pattern: *http_url,
                    }
          - name: social
            label: 社交展示
            widget: object
            collapsed: true
            i18n: duplicate
            fields:
              - { name: title, label: 标题, widget: string, i18n: true }
              - { name: description, label: 简介, widget: text, i18n: true }
              - name: items
                label: 社交链接
                widget: list
                collapsed: true
                i18n: duplicate
                summary: "{{platform}}"
                fields:
                  - {
                      name: platform,
                      label: 名称,
                      widget: string,
                      i18n: duplicate,
                    }
                  - {
                      name: icon,
                      label: 图标,
                      widget: select,
                      i18n: duplicate,
                      options: [email, github, link, rss, steam, telegram, x],
                    }
                  - {
                      name: color,
                      label: 图标颜色,
                      widget: color,
                      required: false,
                      i18n: duplicate,
                    }
                  - name: href
                    label: 链接地址
                    widget: string
                    i18n: duplicate
                    pattern: &social_url
                      - '^(?:https?://[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::[0-9]{1,5})?(?:[/?#][^\s\\]*)?|mailto:[^\s@\\]+@[^\s@\\]+(?:\?[^\s\\]*)?|/(?:$|[^/\\\s][^\s\\]*))$'
                      - 请输入 HTTP(S)、邮箱链接或站内绝对路径
                  - {
                      name: metric,
                      label: 数据单位,
                      widget: string,
                      required: false,
                      i18n: true,
                    }
                  - name: api
                    label: 统计数据接口
                    widget: string
                    required: false
                    i18n: duplicate
                    pattern:
                      [
                        "^[A-Za-z0-9_-]+/[A-Za-z0-9_.:@-]+$",
                        "例如 github/WeiFurryovo",
                      ]
          - name: notes
            label: 补充说明
            widget: object
            collapsed: true
            i18n: duplicate
            fields:
              - { name: title, label: 标题, widget: string, i18n: true }
              - { name: summary, label: 摘要, widget: string, i18n: true }
              - { name: body, label: 内容, widget: text, i18n: true }
          - name: timeline
            label: 时间线
            widget: object
            collapsed: true
            i18n: duplicate
            fields:
              - { name: title, label: 标题, widget: string, i18n: true }
              - { name: description, label: 简介, widget: text, i18n: true }
              - name: items
                label: 事件
                widget: list
                collapsed: true
                i18n: duplicate
                summary: "{{date}}"
                fields:
                  - {
                      name: date,
                      label: 日期,
                      widget: string,
                      i18n: duplicate,
                      pattern: ['^\d{4}-\d{2}-\d{2}$', "请输入 YYYY-MM-DD"],
                    }
                  - { name: content, label: 内容, widget: text, i18n: true }
      - name: advanced
        label: 高级设置
        widget: object
        required: false
        collapsed: true
        i18n: duplicate
        fields:
          - {
              name: ogImage,
              label: 分享图片,
              widget: image,
              required: false,
              i18n: duplicate,
            }
          - {
              name: canonicalURL,
              label: 原文地址,
              widget: string,
              required: false,
              i18n: true,
            }

  - name: homepage
    label: 首页内容
    label_singular: 首页
    icon: home
    i18n: true
    files:
      - name: home
        label: 首页
        file: src/content/home/{{locale}}/home.yml
        format: yaml
        i18n: true
        preview_path: "/{{locale}}/"
        fields:
          - name: profile
            label: 首页资料
            widget: object
            i18n: duplicate
            collapsed: false
            fields:
              - {
                  name: displayName,
                  label: 显示名称,
                  widget: string,
                  i18n: true,
                }
              - { name: avatar, label: 头像, widget: image, i18n: duplicate }
              - {
                  name: location,
                  label: 位置或状态,
                  widget: string,
                  i18n: true,
                }
          - name: introduction
            label: 首页介绍
            widget: object
            i18n: duplicate
            collapsed: true
            fields:
              - { name: role, label: 简短介绍, widget: string, i18n: true }
              - { name: about, label: 详细介绍, widget: text, i18n: true }
          - name: publishing
            label: 发布方式
            widget: object
            i18n: duplicate
            collapsed: true
            fields:
              - { name: heading, label: 标题, widget: string, i18n: true }
              - { name: description, label: 说明, widget: text, i18n: true }
          - name: links
            label: 首页按钮
            widget: object
            i18n: duplicate
            collapsed: true
            fields:
              - { name: source, label: 项目链接, widget: string, i18n: true }
              - { name: readPosts, label: 阅读文章, widget: string, i18n: true }
              - { name: moreAbout, label: 关于页面, widget: string, i18n: true }
              - { name: morePosts, label: 更多文章, widget: string, i18n: true }
              - { name: gallery, label: 浏览相册, widget: string, i18n: true }

  - divider: true

  - name: categories
    label: 分类目录
    label_singular: 分类
    icon: folder
    folder: src/content/categories
    create: true
    identifier_field: name.zh
    sortable_fields: [name.zh, name.en]
    extension: yml
    format: yaml
    slug: "{{uuid}}"
    summary: "{{name.zh}} / {{name.en}}"
    preview_path: "/categories/{{fields.slug.zh}}/"
    fields: &taxonomy_fields
      - name: name
        label: 名称
        widget: object
        fields:
          - { name: zh, label: 中文, widget: string }
          - { name: en, label: English, widget: string }
      - name: slug
        label: 网址名称
        widget: object
        collapsed: auto
        fields:
          - name: zh
            label: 中文网址
            widget: string
            pattern:
              &term_slug [
                '^[^\s/?#%\\.][^\s/?#%\\]*$',
                "请输入不含空格或路径分隔符的网址名称",
              ]
          - { name: en, label: 英文网址, widget: string, pattern: *term_slug }
      - name: description
        label: 描述
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: zh, label: 中文, widget: text, required: false }
          - { name: en, label: English, widget: text, required: false }
      - name: aliases
        label: 旧网址
        widget: object
        required: false
        collapsed: true
        fields:
          - name: zh
            label: 中文旧网址名称
            widget: list
            required: false
            field:
              {
                name: slug,
                label: 网址名称,
                widget: string,
                pattern: *term_slug,
              }
          - name: en
            label: 英文旧网址名称
            widget: list
            required: false
            field:
              {
                name: slug,
                label: 网址名称,
                widget: string,
                pattern: *term_slug,
              }

  - name: tags
    label: 标签
    label_singular: 标签
    icon: sell
    folder: src/content/tags
    create: true
    identifier_field: name.zh
    sortable_fields: [name.zh, name.en]
    extension: yml
    format: yaml
    slug: "{{uuid}}"
    summary: "{{name.zh}} / {{name.en}}"
    preview_path: "/tags/{{fields.slug.zh}}/"
    fields: *taxonomy_fields

  - divider: true

  - name: navigation
    label: 导航菜单
    icon: menu
    files:
      - name: navigation
        label: 导航菜单
        file: src/data/settings/navigation.json
        format: json
        fields:
          - name: posts
            label: 文章
            widget: object
            collapsed: true
            fields: &navigation_fields
              - name: label
                label: 菜单文字
                widget: object
                fields:
                  - { name: zh, label: 中文, widget: string }
                  - { name: en, label: English, widget: string }
              - name: href
                label: 目标地址
                widget: string
                pattern:
                  - '^(?:https?://[^\s\\]+|/(?:$|[^/\s\\][^\s\\]*)|[A-Za-z0-9][^:\s\\]*)$'
                  - 请输入 HTTP(S) 地址或站内路径
          - {
              name: categories,
              label: 分类,
              widget: object,
              collapsed: true,
              fields: *navigation_fields,
            }
          - {
              name: gallery,
              label: 相册,
              widget: object,
              collapsed: true,
              fields: *navigation_fields,
            }
          - {
              name: archives,
              label: 归档,
              widget: object,
              collapsed: true,
              fields: *navigation_fields,
            }
          - {
              name: tags,
              label: 标签,
              widget: object,
              collapsed: true,
              fields: *navigation_fields,
            }
          - {
              name: about,
              label: 关于,
              widget: object,
              collapsed: true,
              fields: *navigation_fields,
            }

  - name: footer
    label: 页脚与联系
    icon: bottom_navigation
    files:
      - name: footer
        label: 页脚与联系
        file: src/data/settings/footer.json
        format: json
        fields:
          - { name: copyrightName, label: 版权名称, widget: string }
          - name: filings
            label: 备案信息
            widget: list
            required: false
            collapsed: true
            summary: "{{label}}"
            fields:
              - { name: label, label: 备案文字, widget: string }
              - {
                  name: url,
                  label: 查询地址,
                  widget: string,
                  required: false,
                  pattern: *http_url,
                }
          - name: socials
            label: 社交与联系链接
            widget: list
            required: false
            collapsed: true
            summary: "{{linkTitle}}"
            fields:
              - name: name
                label: 图标
                widget: select
                options:
                  [
                    github,
                    gitlab,
                    discord,
                    youtube,
                    instagram,
                    x,
                    telegram,
                    rss,
                    email,
                    reddit,
                    bluesky,
                    tiktok,
                    weibo,
                    steam,
                    bilibili,
                    zhihu,
                    coolapk,
                    netease,
                    link,
                  ]
              - {
                  name: linkTitle,
                  label: 名称,
                  widget: string,
                  required: false,
                }
              - { name: url, label: 地址, widget: string, pattern: *social_url }

  - divider: true

  - name: site
    label: 站点资料
    icon: settings
    files:
      - name: site
        label: 站点资料
        file: src/data/settings/site.json
        format: json
        fields:
          - { name: siteName, label: 站点名称, widget: string }
          - { name: browserTitle, label: 浏览器标题, widget: string }
          - { name: description, label: 站点描述, widget: text }
          - { name: favicon, label: 站点图标, widget: image }
          - { name: author, label: 默认作者, widget: string }
          - {
              name: profile,
              label: 作者主页,
              widget: string,
              pattern: *http_url,
            }
          - { name: ogImage, label: 默认分享图片, widget: image }
          - { name: timezone, label: 默认时区, widget: string }
