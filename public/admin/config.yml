# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Sveltia CMS

backend:
  name: github
  repo: WeiFurryovo/Inklume
  branch: main
  base_url: https://inklume.pages.dev

media_folder: public/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [zh, en]
  default_locale: zh
  initial_locales: default
  omit_default_locale_from_preview_path: true

slug:
  encoding: unicode
  clean_accents: true

collections:
  - name: homepage
    label: Homepage
    label_singular: Homepage
    icon: home
    i18n: true
    files:
      - name: home
        label: Homepage
        file: src/content/home/{{locale}}/home.yml
        format: yaml
        i18n: true
        preview_path: "/{{locale}}/"
        fields:
          - name: identity
            label: Site Identity
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Shared branding used across both language versions.
            fields:
              - name: siteName
                label: Header Site Name
                widget: string
                hint: Text shown at the top left of every page.
              - name: browserTitle
                label: Browser Tab Title
                widget: string
                hint: Base title used in browser tabs and page titles.
              - name: favicon
                label: Favicon
                widget: image
                hint: Small icon shown in browser tabs and bookmarks.
          - name: profile
            label: Homepage Profile
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Profile block at the top of the homepage.
            fields:
              - name: displayName
                label: Display Name
                widget: string
                i18n: true
                hint: Large name shown below the homepage avatar.
              - name: avatar
                label: Avatar
                widget: image
                i18n: duplicate
                hint: Shared profile image at the top of the homepage.
              - name: location
                label: Location / Status
                widget: string
                i18n: true
                hint: Text shown beside the location icon.
          - name: introduction
            label: Homepage About
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Introductory copy in the homepage About section.
            fields:
              - name: role
                label: Role / Tagline
                widget: string
                i18n: true
                hint: Short line above the homepage introduction.
              - name: about
                label: Introduction
                widget: text
                i18n: true
                hint: Main introduction shown in the homepage About section.
          - name: publishing
            label: Publishing Card
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Card describing how the site is built and published.
            fields:
              - name: heading
                label: Heading
                widget: string
                i18n: true
                hint: Title inside the homepage Publishing card.
              - name: description
                label: Description
                widget: text
                i18n: true
                hint: Supporting text inside the homepage Publishing card.
          - name: links
            label: Homepage Buttons
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Text shown on homepage buttons and links. Destinations are fixed by the site routes.
            fields:
              - name: source
                label: Source Link Label
                widget: string
                i18n: true
                hint: Label beside the GitHub icon in the homepage profile.
              - name: readPosts
                label: Top Posts Button
                widget: string
                i18n: true
                hint: Main button directly below the homepage profile.
              - name: moreAbout
                label: About Section Button
                widget: string
                i18n: true
                hint: Button at the end of the homepage About section.
              - name: morePosts
                label: Posts Section Button
                widget: string
                i18n: true
                hint: Button at the end of the homepage Posts section.
              - name: gallery
                label: Gallery Section Button
                widget: string
                i18n: true
                hint: Button at the end of the homepage Gallery section.
          - name: navigation
            label: Navigation Labels
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Text shown in the top navigation menu.
            fields:
              - name: posts
                label: Posts
                widget: string
                i18n: true
              - name: gallery
                label: Gallery
                widget: string
                i18n: true
              - name: archives
                label: Archives
                widget: string
                i18n: true
              - name: tags
                label: Tags
                widget: string
                i18n: true
              - name: about
                label: About
                widget: string
                i18n: true
          - name: footer
            label: Footer Settings
            widget: object
            i18n: duplicate
            collapsed: true
            hint: Shared copyright and filing links shown at the bottom of every page.
            fields:
              - name: copyrightName
                label: Copyright Name
                widget: string
              - name: filings
                label: Filing Records
                widget: list
                required: false
                summary: "{{label}}"
                fields:
                  - name: label
                    label: Display Text
                    widget: string
                  - name: url
                    label: URL
                    widget: string
                    required: false
                    pattern:
                      - "^https?://"
                      - URL must start with http:// or https://

  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    icon: article
    folder: src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "/{{locale}}/posts/{{slug}}"
    summary: "{{title}} - {{pubDatetime | date('YYYY-MM-DD')}}"
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: author
        label: Author
        widget: string
        required: false
        i18n: duplicate
      - name: pubDatetime
        label: Published At
        widget: datetime
        default: "{{now}}"
        input_timezone: Asia/Singapore
        output_utc: true
        i18n: duplicate
      - name: modDatetime
        label: Updated At
        widget: datetime
        required: false
        input_timezone: Asia/Singapore
        output_utc: true
        i18n: true
      - name: featured
        label: Featured
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: draft
        label: Draft
        widget: boolean
        default: true
        required: false
        i18n: true
      - name: gallery
        label: Include in Gallery
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: tags
        label: Tags
        widget: list
        default: [others]
        i18n: true
      - name: heroImage
        label: Hero Image
        widget: object
        required: false
        i18n: true
        fields:
          - name: src
            label: Image
            widget: image
            i18n: duplicate
          - name: alt
            label: Alternative Text
            widget: string
            required: false
            i18n: true
          - name: color
            label: Accent Color
            widget: color
            required: false
            i18n: duplicate
      - name: ogImage
        label: Social Image
        widget: image
        required: false
        i18n: duplicate
      - name: canonicalURL
        label: Canonical URL
        widget: string
        required: false
        i18n: true
      - name: hideEditPost
        label: Hide Edit Link
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: timezone
        label: Display Timezone
        widget: string
        required: false
        i18n: duplicate
      - name: body
        label: Body
        widget: richtext
        i18n: true

  - name: pages
    label: Pages
    label_singular: Page
    icon: web
    folder: src/content/pages
    create: false
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "/{{locale}}/{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        required: false
        i18n: true
      - name: ogImage
        label: Social Image
        widget: image
        required: false
        i18n: duplicate
      - name: canonicalURL
        label: Canonical URL
        widget: string
        required: false
        i18n: true
      - name: aboutModules
        label: About Page Modules
        widget: object
        required: false
        i18n: duplicate
        fields:
          - name: motto
            label: Motto and Spoiler
            widget: object
            i18n: duplicate
            fields:
              - name: text
                label: Motto
                widget: string
                i18n: true
              - name: spoiler
                label: Hidden Text
                widget: string
                i18n: true
          - name: cta
            label: Action Button
            widget: object
            i18n: duplicate
            fields:
              - name: label
                label: Button Label
                widget: string
                i18n: true
              - name: href
                label: URL
                widget: string
                i18n: duplicate
                pattern:
                  - "^https?://"
                  - URL must start with http:// or https://
          - name: siteStack
            label: Site Stack
            widget: object
            i18n: duplicate
            fields:
              - name: title
                label: Section Title
                widget: string
                i18n: true
              - name: description
                label: Introduction
                widget: text
                i18n: true
              - name: groupLabel
                label: Group Label
                widget: string
                i18n: true
              - name: items
                label: Stack Items
                widget: list
                i18n: duplicate
                summary: "{{name}}"
                fields:
                  - name: name
                    label: Name
                    widget: string
                    i18n: duplicate
                  - name: description
                    label: Description
                    widget: string
                    i18n: true
                  - name: icon
                    label: Icon
                    widget: select
                    i18n: duplicate
                    options:
                      - { label: Astro, value: astro }
                      - { label: Cloudflare, value: cloudflare }
                      - { label: GitHub, value: github }
                      - { label: Pagefind, value: pagefind }
                      - { label: Astro Theme Pure, value: pure }
                      - { label: Sveltia CMS, value: sveltia }
                  - name: href
                    label: URL
                    widget: string
                    i18n: duplicate
                    pattern:
                      - "^https?://"
                      - URL must start with http:// or https://
          - name: social
            label: Social Networks
            widget: object
            i18n: duplicate
            fields:
              - name: title
                label: Section Title
                widget: string
                i18n: true
              - name: description
                label: Introduction
                widget: text
                i18n: true
              - name: items
                label: Social Links
                widget: list
                i18n: duplicate
                summary: "{{platform}}"
                fields:
                  - name: platform
                    label: Platform
                    widget: string
                    i18n: duplicate
                  - name: icon
                    label: Icon
                    widget: select
                    i18n: duplicate
                    options: [email, github, link, rss, steam, telegram, x]
                  - name: color
                    label: Icon Color
                    widget: color
                    required: false
                    i18n: duplicate
                  - name: href
                    label: URL
                    widget: string
                    i18n: duplicate
                    pattern:
                      - "^(?:https?://[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::[0-9]{1,5})?(?:[/?#][^\\s\\\\]*)?|mailto:[^\\s@\\\\]+@[^\\s@\\\\]+(?:\\?[^\\s\\\\]*)?|/(?:$|[^/\\\\\\s][^\\s\\\\]*))$"
                      - Use http(s), mailto, or a root-relative path
                  - name: metric
                    label: Metric Label
                    widget: string
                    required: false
                    i18n: true
                  - name: api
                    label: Substats API Path
                    widget: string
                    required: false
                    i18n: duplicate
                    pattern:
                      - "^[A-Za-z0-9_-]+/[A-Za-z0-9_.:@-]+$"
                      - Use a path such as github/WeiFurryovo
          - name: notes
            label: Collapsible Notes
            widget: object
            i18n: duplicate
            fields:
              - name: title
                label: Section Title
                widget: string
                i18n: true
              - name: summary
                label: Collapsed Title
                widget: string
                i18n: true
              - name: body
                label: Content
                widget: text
                i18n: true
          - name: timeline
            label: Site Timeline
            widget: object
            i18n: duplicate
            fields:
              - name: title
                label: Section Title
                widget: string
                i18n: true
              - name: description
                label: Introduction
                widget: text
                i18n: true
              - name: items
                label: Events
                widget: list
                i18n: duplicate
                summary: "{{date}}"
                fields:
                  - name: date
                    label: Date
                    widget: string
                    i18n: duplicate
                    pattern:
                      - "^\\d{4}-\\d{2}-\\d{2}$"
                      - Use YYYY-MM-DD
                  - name: content
                    label: Content
                    widget: text
                    i18n: true
      - name: body
        label: Body
        widget: richtext
        i18n: true
