# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Sveltia CMS

backend:
  name: github
  repo: WeiFurryovo/Inklume
  branch: main
  base_url: https://inklume.pages.dev

media_folder: public/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [zh, en]
  default_locale: zh
  initial_locales: default
  omit_default_locale_from_preview_path: true

slug:
  encoding: unicode
  clean_accents: true

collections:
  - name: homepage
    label: Homepage
    label_singular: Homepage
    icon: home
    i18n: true
    files:
      - name: home
        label: Homepage
        file: src/content/home/{{locale}}/home.yml
        format: yaml
        i18n: true
        preview_path: "/{{locale}}/"
        fields:
          - name: siteName
            label: Site Name
            widget: string
            i18n: duplicate
          - name: browserTitle
            label: Browser Tab Title
            widget: string
            i18n: duplicate
          - name: displayName
            label: Display Name
            widget: string
            i18n: true
          - name: avatar
            label: Avatar
            widget: image
            i18n: duplicate
          - name: location
            label: Location
            widget: string
            i18n: true
          - name: role
            label: Role
            widget: string
            i18n: true
          - name: about
            label: About
            widget: text
            i18n: true
          - name: publishingHeading
            label: Publishing Heading
            widget: string
            i18n: true
          - name: publishingDescription
            label: Publishing Description
            widget: text
            i18n: true
          - name: links
            label: Homepage Link Labels
            widget: object
            i18n: true
            fields:
              - name: source
                label: Source Code
                widget: string
                i18n: true
              - name: readPosts
                label: Read Posts
                widget: string
                i18n: true
              - name: moreAbout
                label: More About
                widget: string
                i18n: true
              - name: morePosts
                label: More Posts
                widget: string
                i18n: true
              - name: gallery
                label: Gallery
                widget: string
                i18n: true
          - name: navigation
            label: Navigation Labels
            widget: object
            i18n: true
            fields:
              - name: posts
                label: Posts
                widget: string
                i18n: true
              - name: gallery
                label: Gallery
                widget: string
                i18n: true
              - name: archives
                label: Archives
                widget: string
                i18n: true
              - name: tags
                label: Tags
                widget: string
                i18n: true
              - name: about
                label: About
                widget: string
                i18n: true

  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    icon: article
    folder: src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "/{{locale}}/posts/{{slug}}"
    summary: "{{title}} - {{pubDatetime | date('YYYY-MM-DD')}}"
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        i18n: true
      - name: author
        label: Author
        widget: string
        required: false
        i18n: duplicate
      - name: pubDatetime
        label: Published At
        widget: datetime
        default: "{{now}}"
        input_timezone: Asia/Singapore
        output_utc: true
        i18n: duplicate
      - name: modDatetime
        label: Updated At
        widget: datetime
        required: false
        input_timezone: Asia/Singapore
        output_utc: true
        i18n: true
      - name: featured
        label: Featured
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: draft
        label: Draft
        widget: boolean
        default: true
        required: false
        i18n: true
      - name: gallery
        label: Include in Gallery
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: tags
        label: Tags
        widget: list
        default: [others]
        i18n: true
      - name: heroImage
        label: Hero Image
        widget: object
        required: false
        i18n: true
        fields:
          - name: src
            label: Image
            widget: image
            i18n: duplicate
          - name: alt
            label: Alternative Text
            widget: string
            required: false
            i18n: true
          - name: color
            label: Accent Color
            widget: color
            required: false
            i18n: duplicate
      - name: ogImage
        label: Social Image
        widget: image
        required: false
        i18n: duplicate
      - name: canonicalURL
        label: Canonical URL
        widget: string
        required: false
        i18n: true
      - name: hideEditPost
        label: Hide Edit Link
        widget: boolean
        default: false
        required: false
        i18n: duplicate
      - name: timezone
        label: Display Timezone
        widget: string
        required: false
        i18n: duplicate
      - name: body
        label: Body
        widget: richtext
        i18n: true

  - name: pages
    label: Pages
    label_singular: Page
    icon: web
    folder: src/content/pages
    create: false
    extension: md
    format: yaml-frontmatter
    i18n: true
    slug: "{{slug}}"
    preview_path: "/{{locale}}/{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: text
        required: false
        i18n: true
      - name: ogImage
        label: Social Image
        widget: image
        required: false
        i18n: duplicate
      - name: canonicalURL
        label: Canonical URL
        widget: string
        required: false
        i18n: true
      - name: body
        label: Body
        widget: richtext
        i18n: true
